name: Starting The Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the monorepo
      - name: Checkout Code
        uses: actions/checkout@v7

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 3. Build & Push Backend Image
      - name: Build and Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dowells-backend:latest

      # 4. Build & Push Frontend Image
      - name: Build and Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dowells-frontend:latest

      # 5. SSH To the server
      # Pull the Image from Docker Registry
      # run Docker compose up -d
      - name: Execute remote SSH commands using PRIVATE_KEY
        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            set -e
            cd /home/app

            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            sudo docker image prune -f
